<!DOCTYPE html>
<html lang="zh-TW">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>鑫堡視覺選型平台</title>
	<meta name="description" content="整合相機選型、鏡頭選型計算與飛拍計算的一站式工業視覺選型平台。">
	<style>
		/* ========================================== */
		/* 基礎版面與明亮現代風格 CSS 變數定義          */
		/* ========================================== */
		:root {
			--primary: #2563eb;
			/* 現代高飽和科技藍 */
			--primary-light: #eff6ff;
			/* 極淺藍色背景 */
			--bg-main: #f8fafc;
			/* 乾淨的主內容底色 */
			--bg-sidebar: #ffffff;
			/* 純白高質感側邊欄 */
			--text-main: #0f172a;
			/* 深邃俐落字體色 */
			--text-muted: #000000;
			/* 優雅內斂灰色 */
			--border-color: #e2e8f0;
			/* 細緻極淺灰描邊 */
			--radius-main: 12px;
			/* 當代圓潤倒角 */
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", Roboto, Helvetica, Arial, sans-serif;
			background-color: var(--bg-main);
			color: var(--text-main);
			margin: 0;
			padding: 0;
			display: flex;
			height: 100vh;
			overflow: hidden;
			-webkit-font-smoothing: antialiased;
		}

		/* ========================================== */
		/* 左側導覽列樣式 (固定為極簡精簡版面)          */
		/* ========================================== */
		.sidebar {
			width: 120px;
			/* 固定縮小寬度 */
			background-color: var(--bg-sidebar);
			display: flex;
			flex-direction: column;
			padding: 24px 8px;
			box-sizing: border-box;
			border-right: 1px solid var(--border-color);
			flex-shrink: 0;
			z-index: 100;
			box-shadow: 4px 0 24px rgba(15, 23, 42, 0.015);
		}

		/* 頂部 LOGO 區塊 */
		.sidebar-logo {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 8px;
			margin-bottom: 32px;
			padding-bottom: 20px;
			border-bottom: 1px solid var(--border-color);
			text-align: center;
		}

		.sidebar-logo svg {
			width: 200px;
			height: 28px;
			fill: var(--primary);
			flex-shrink: 0;
		}

		/* 現代感漸層文字 */
		.text-short {
			font-size: 15px;
			font-weight: 700;
			margin: 0;
			line-height: 1.3;
			letter-spacing: -0.01em;
			background: linear-gradient(135deg, var(--text-main) 30%, #475569 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			white-space: nowrap;
		}

		/* ========================================== */
		/* 選單按鈕樣式                               */
		/* ========================================== */
		.sidebar-menu {
			display: flex;
			flex-direction: column;
			gap: 8px;
			flex-grow: 1;
		}

		.menu-item {
			display: flex;
			flex-direction: column;
			/* 圖示與文字上下排列 */
			align-items: center;
			gap: 6px;
			padding: 12px 4px;
			color: var(--text-muted);
			text-decoration: none;
			border-radius: var(--radius-main);
			font-size: 13px;
			font-weight: 600;
			font-family: inherit;
			cursor: pointer;
			transition: all 0.2s ease;
			background: transparent;
			border: none;
			width: 100%;
			box-sizing: border-box;
			text-align: center;
		}

		.menu-item svg {
			width: 20px;
			height: 20px;
			stroke: currentColor;
			fill: none;
			stroke-width: 2.2;
			flex-shrink: 0;
			transition: transform 0.2s ease;
		}

		/* 滑過狀態 (微幅向上懸浮與微灰底) */
		.menu-item:hover {
			background-color: #f1f5f9;
			color: var(--text-main);
		}

		.menu-item:hover svg {
			transform: translateY(-1px);
		}

		/* 點選啟動狀態 (現代極光藍包裹) */
		.menu-item.active {
			background-color: var(--primary-light);
			color: var(--primary);
		}

		.menu-text-short {
			white-space: nowrap;
		}

		/* 頁尾宣告 */
		.sidebar-footer {
			margin-top: auto;
			font-size: 11px;
			color: var(--text-muted);
			text-align: center;
			border-top: 1px solid var(--border-color);
			padding-top: 15px;
			white-space: nowrap;
			letter-spacing: 0.02em;
		}

		/* ========================================== */
		/* 右側主內容顯示區                            */
		/* ========================================== */
		.main-content-wrapper {
			flex: 1;
			position: relative;
			height: 100vh;
			overflow: hidden;
			background-color: var(--bg-main);
		}

		.page-content {
			display: none;
			width: 100%;
			height: 100%;
			box-sizing: border-box;
		}

		.page-content.active {
			display: block;
		}

		.iframe-container {
			width: 100%;
			height: 100%;
			border: none;
			margin: 0;
			padding: 0;
			display: block;
			background-color: var(--bg-main);
		}

		/* ========================================== */
		/* 響應式佈局（手機/平板過渡）                 */
		/* ========================================== */
		@media (max-width: 768px) {
			body {
				flex-direction: column;
				height: 100vh;
				/* 保持視窗滿版，不允許整個網頁捲動 */
				overflow: hidden;
			}

			.sidebar {
				width: 100%;
				border-right: none;
				border-bottom: 1px solid var(--border-color);
				padding: 12px 16px;
				/* 微調內距減少空間佔用 */
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
			}

			.sidebar-logo {
				flex-direction: row;
				margin-bottom: 12px;
				padding-bottom: 8px;
				justify-content: center;
				gap: 10px;
				align-items: flex-end;
			}

			.sidebar-logo svg {
				width: 90px;
				/* 將原本的 200px 縮小，去除兩側透明留白 */
				height: 28px;
				/* 保持原本的高度 */
			}


			/* 行動版隱藏頁尾，騰出更多空間給 iframe */
			.sidebar-footer {
				display: none;
			}

			.sidebar-menu {
				flex-direction: row;
				justify-content: center;
				flex-wrap: wrap;
				gap: 6px;
			}

			.menu-item {
				width: auto;
				padding: 6px 12px;
				font-size: 13px;
				border-radius: 8px;
				flex-direction: row;
				gap: 6px;
			}

			.menu-item:hover svg {
				transform: translateX(1px);
			}

			.main-content-wrapper {
				flex: 1;
				/* 自動填滿上方選單扣除後的剩餘所有垂直螢幕空間 */
				height: auto;
				/* 解除寫死的高比例 */
			}
		}
	</style>
</head>

	<script>
		// 所有分頁的設定資料
		const TABS = [
			{ id: 'camera', btnId: 'side-tab-camera', pageId: 'page-camera' },
			{ id: 'lens', btnId: 'side-tab-lens', pageId: 'page-lens' },
		];

		// 分頁點擊切換邏輯
		function switchSidebar(tabName) {
			TABS.forEach(tab => {
				const btn = document.getElementById(tab.btnId);
				const page = document.getElementById(tab.pageId);
				if (tab.id === tabName) {
					btn.classList.add('active');
					page.classList.add('active');
				} else {
					btn.classList.remove('active');
					page.classList.remove('active');
				}
			});

			// 【修改】切換時同步將分頁 ID 記錄到瀏覽器中
			localStorage.setItem('selectedVisualTab', tabName);
		}

		// 【新增】網頁載入時，自動還原上一次選取的分頁
		window.addEventListener('DOMContentLoaded', () => {
			const savedTab = localStorage.getItem('selectedVisualTab');
			const hasTab = TABS.some(tab => tab.id === savedTab);

			if (savedTab && hasTab) {
				switchSidebar(savedTab);
			} else {
				switchSidebar('camera'); // 預設停留在第一個分頁
			}
		});
	</script>
